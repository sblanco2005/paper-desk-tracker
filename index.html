<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e11" />
  <meta name="description" content="Paper Desk Tracker — Santiago Blanco options book ledger (paper only)" />
  <title>Paper Desk Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-titles">
      <h1>Paper Desk Tracker</h1>
      <div class="paper-sub">PAPER</div>
    </div>
    <span class="badge" title="Hold 1.5s to reset seed">PAPER</span>
  </header>

  <main class="main">
    <section id="screen-book" class="screen" aria-label="Book"></section>
    <section id="screen-positions" class="screen" aria-label="Positions"></section>
    <section id="screen-blotter" class="screen" aria-label="Blotter"></section>
    <section id="screen-marks" class="screen" aria-label="Marks history"></section>
    <section id="screen-universe" class="screen" aria-label="Universe"></section>
  </main>

  <nav class="tab-bar" aria-label="Primary">
    <button type="button" class="tab-btn active" data-screen="book" aria-label="Book">
      <svg viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 012-2h9"/><path d="M4 19h14a2 2 0 002-2V7"/><path d="M8 7h6M8 11h8M8 15h5"/></svg>
      Book
    </button>
    <button type="button" class="tab-btn" data-screen="positions" aria-label="Positions">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/></svg>
      Positions
    </button>
    <button type="button" class="tab-btn" data-screen="blotter" aria-label="Blotter">
      <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></svg>
      Blotter
    </button>
    <button type="button" class="tab-btn" data-screen="marks" aria-label="Marks">
      <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
      Marks
    </button>
    <button type="button" class="tab-btn" data-screen="universe" aria-label="Universe">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></svg>
      Universe
    </button>
  </nav>

  <div id="mark-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="mark-modal-title">
    <div class="modal">
      <h3 id="mark-modal-title">Update mark</h3>
      <label for="mark-input">Mid (debit)</label>
      <input id="mark-input" type="number" step="0.01" min="0" inputmode="decimal" />
      <div class="modal-actions">
        <button type="button" class="btn" id="mark-cancel">Cancel</button>
        <button type="button" class="btn primary" id="mark-save">Save mark</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
